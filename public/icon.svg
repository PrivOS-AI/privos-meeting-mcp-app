<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meeting Agent">
  <defs>
    <linearGradient id="ma-bg" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06223A"/>
      <stop offset="1" stop-color="#001930"/>
    </linearGradient>
    <linearGradient id="ma-gold" x1="66" y1="34" x2="94" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD957"/>
      <stop offset="1" stop-color="#E5A800"/>
    </linearGradient>
  </defs>
  <!-- Rounded-square badge, brand navy -->
  <rect x="6" y="6" width="148" height="148" rx="34" fill="url(#ma-bg)"/>
  <rect x="6.5" y="6.5" width="147" height="147" rx="33.5" stroke="#0C2A45" stroke-width="1"/>
  <!-- Microphone capsule -->
  <rect x="66" y="34" width="28" height="52" rx="14" fill="url(#ma-gold)"/>
  <!-- Mic cradle arc + stem -->
  <path d="M52 78a28 28 0 0 0 56 0" stroke="#FFC814" stroke-width="7" stroke-linecap="round"/>
  <rect x="76.5" y="104" width="7" height="16" rx="3.5" fill="#FFC814"/>
  <!-- Caption lines -->
  <rect x="45" y="126" width="70" height="8" rx="4" fill="#3C82E6"/>
  <rect x="57" y="140" width="46" height="8" rx="4" fill="#6A7584"/>
</svg>
